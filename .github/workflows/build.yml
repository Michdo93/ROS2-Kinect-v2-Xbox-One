name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
    container: ros:${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/kinect_v2_ros2
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y python3-numpy python3-pytest ros-${{ matrix.distro }}-tf2-ros
      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_direct+
      - name: Unit tests
        shell: bash
        run: cd src/kinect_v2_ros2 && python3 -m pytest -q test
      - name: Simulation smoke test
        shell: bash
        run: |
          source install/setup.bash
          timeout -s INT 15 ros2 launch kinect_v2_ros2 kinect_v2.launch.py simulate:=true &
          sleep 8
          timeout 10 ros2 topic echo --once --field encoding /kinect_v2/color/image_raw
          wait || true
